<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header / API Key Input -->
    <header class="bg-white p-4 shadow-sm flex items-center gap-4">
        <input type="password" id="apiKey" placeholder="Enter Groq API Key" 
               class="flex-1 p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="text-xs text-gray-500">Using llama-3.3-70b-versatile</div>
    </header>

    <!-- Chat Area -->
    <main id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Messages will appear here -->
    </main>

    <!-- Input Area -->
    <footer class="p-4 bg-white border-t">
        <form id="chatForm" class="flex gap-2">
            <input type="text" id="userInput" placeholder="Type a message..." required
                   class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                Send
            </button>
        </form>
    </footer>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const apiKeyInput = document.getElementById('apiKey');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg max-w-[80%] ${role === 'user' ? 'bg-blue-600 text-white ml-auto' : 'bg-gray-200 text-black mr-auto'}`;
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) return alert("Please enter your Groq API Key");
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{ role: 'user', content: message }]
                    })
                });

                const data = await response.json();
                
                if (data.choices) {
                    appendMessage('ai', data.choices[0].message.content);
                } else {
                    appendMessage('ai', 'Error: ' + (data.error?.message || 'Unknown error'));
                }
            } catch (err) {
                appendMessage('ai', 'Connection error: ' + err.message);
            }
        });
    </script>
</body>
</html>
